name: nova_shop
description: "NOVA shop Project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_gen: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  flutter_gen_runner: ^5.15.0


flutter_gen:
  output: lib/core/gen/

  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

  fonts:
    - family: NSSB
      fonts:
        - asset: assets/fonts/NotoSans-SemiBold.ttf
    - family: NSM
      fonts:
        - asset: assets/fonts/NotoSans-Medium.ttf
    - family: NSR
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf